[tool.poetry]
name = "modeling_spanish_naacl25"
version = "0.1.0"
description = "Frequency matters: Modeling irregular morphological patterns in Spanish with Transformers"
authors = ["Akhilesh Kakolu Ramarao", "Kevin Tang", "Dinah Baer-Henney"]

[tool.poetry.dependencies]
python = "^3.9"
pandas = "^1.3.5"
jupyter = "^1.0.0"
unidecode = "1.3.2"
matplotlib = "3.5.0"
pyenchant = "3.2.2"
tqdm = "^4.62.3"
seaborn = "^0.11.2"
Sphinx = "^4.3.2"
black =  "^21.12b0"
docopt= "^0.6.2"
fairseq = "0.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^5.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
